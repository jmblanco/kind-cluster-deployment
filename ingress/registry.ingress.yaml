apiVersion: v1
kind: Service
metadata:
  name: zot-registry
  namespace: default
spec:
  ports:
  - name: http
    port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: zot-registry
  namespace: default
subsets:
- addresses:
  - ip: 172.18.0.3
  ports:
  - name: http
    port: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zot-registry-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: registry.local
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: zot-registry
            port:
              number: 5000
