name: CI - Lint & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Node.js Test & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CLI Dependencies
        run: |
          cd cli
          npm ci

      - name: Run Test Suite
        run: |
          cd cli
          npm test

      - name: Run Security Audit
        run: |
          cd cli
          npm audit

  lint:
    name: YAML Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python for YAML Lint
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and Run yamllint
        run: |
          pip install yamllint==1.35.1
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" templates/ ingress/
