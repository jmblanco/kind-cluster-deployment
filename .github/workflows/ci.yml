name: CI - Lint & Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck on Bash Scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'

      - name: Set up Python for YAML Lint
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and Run yamllint
        run: |
          pip install yamllint==1.35.1
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" templates/ ingress/
