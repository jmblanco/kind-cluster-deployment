# Helm values for Traefik Ingress Controller on Kind
deployment:
  kind: DaemonSet

additionalArguments:
  - "--serversTransport.insecureSkipVerify=true"

nodeSelector:
  ingress-ready: "true"

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"

ports:
  web:
    port: 80
    hostPort: 80
    exposedPort: 80
  websecure:
    port: 443
    hostPort: 443
    exposedPort: 443

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0

securityContext:
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

service:
  type: ClusterIP

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    publishedService:
      enabled: false

# Traefik dashboard
ingressRoute:
  dashboard:
    enabled: false
